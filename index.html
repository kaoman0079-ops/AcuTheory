<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcuTheory - 国試対策演習マスター</title>
    <style>
        :root {
            --primary-color: #34495e;
            --accent-color: #3498db;
            --success-color: #2ecc71;
            --error-color: #e74c3c;
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg-color);
            color: var(--primary-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 650px;
            padding: 30px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin: 0 0 5px 0;
            color: var(--primary-color);
        }

        .subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: #7f8c8d;
            margin-bottom: 25px;
        }

        .section-box {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .section-title {
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 12px;
        }

        .order-btn {
            background: #fff;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            padding: 12px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            font-weight: 500;
        }

        .order-btn.active {
            background: #e0f2fe;
            border-color: var(--accent-color);
            color: var(--accent-color);
            font-weight: bold;
        }

        /* セレクトボックス */
        .custom-select {
            width: 100%;
            padding: 12px;
            font-size: 0.95rem;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            background: #fff;
        }

        /* スタートボタン */
        .primary-btn {
            display: block;
            width: 100%;
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.05rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.2);
        }

        .primary-btn:hover { background: #2980b9; }

        /* クイズ画面用のスタイル */
        .quiz-progress { font-size: 0.85rem; color: #7f8c8d; text-align: right; margin-bottom: 10px; font-weight: bold;}
        .question-box { font-size: 1.1rem; font-weight: bold; line-height: 1.6; margin-bottom: 20px; background: #f8fafc; padding: 15px; border-radius: 8px; border-left: 4px solid var(--accent-color); }
        .options-list { display: flex; flex-direction: column; gap: 10px; }
        .option-btn { background: #fff; border: 2px solid #e2e8f0; border-radius: 8px; padding: 14px; text-align: left; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; }
        .option-btn:hover:not(:disabled) { background: #f1f5f9; border-color: #cbd5e1; }
        .option-btn.correct { background-color: #d4edda; border-color: var(--success-color); color: #155724; font-weight: bold; }
        .option-btn.wrong { background-color: #f8d7da; border-color: var(--error-color); color: #721c24; }
        
        .result-area { margin-top: 20px; padding: 15px; border-radius: 8px; display: none; border-left: 5px solid; }
        .result-area.correct-box { background: #e8f5e9; border-color: var(--success-color); color: #2e7d32; }
        .result-area.wrong-box { background: #ffebee; border-color: var(--error-color); color: #c62828; }
        .result-title { font-weight: bold; font-size: 1.2rem; margin-bottom: 5px; }

        .nav-btn { background: #fff; border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; margin-bottom: 15px; display: inline-flex; align-items: center; gap: 5px; }
    </style>
</head>
<body>

<div class="container" id="main-container">
    </div>

<script>
    let allQuestions = [];      // CSVから読み込んだ全データ
    let selectedQuestions = []; // 条件に絞り込んだ出題用データ
    let currentIdx = 0;
    let selectedCount = 10;
    let isRandomOrder = true;

    // 最初に起動する関数
    async function initApp() {
        showMenuSkeleton();
        try {
            const response = await fetch('data.csv');
            if (!response.ok) throw new Error('data.csv が読み込めません');
            const text = await response.text();
            parseCSV(text);
            renderMenu();
        } catch (e) {
            document.getElementById('main-container').innerHTML = `<p style="color:red; text-align:center;">${e.message}</p>`;
        }
    }

    // ローディング表示
    function showMenuSkeleton() {
        document.getElementById('main-container').innerHTML = '<h1>国試対策 演習</h1><div class="subtitle">データを読み込み中...</div>';
    }

    // CSVパース（標準の構成：ID, 問題文, 選択肢1-4, 正解番号, 解説）
    function parseCSV(text) {
        const lines = text.split(/\r?\n/);
        allQuestions = [];
        
        for(let i = 1; i < lines.length; i++) {
            if(!lines[i].trim()) continue;
            const parts = lines[i].split(',');
            if(parts.length < 7) continue; // 最低限の列数が足りない場合はスキップ

            const explanation = parts.slice(6).join(',') || '解説はありません。';

            allQuestions.push({
                id: parts[0].trim(),
                question: parts[1].trim(),
                options: [parts[2].trim(), parts[3].trim(), parts[4].trim(), parts[5].trim()],
                correct: parseInt(parts[6].trim(), 10),
                explanation: explanation
            });
        }
    }

    // メニュー画面の描画
    function renderMenu() {
        const container = document.getElementById('main-container');
        container.innerHTML = `
            <h1>国試対策 演習</h1>
            <div class="subtitle">定期試験対策・高速4択マスター</div>

            <div class="section-box">
                <div class="section-title">問題数</div>
                <select class="custom-select" id="count-select" onchange="selectedCount = this.value">
                    <option value="10" ${selectedCount == 10 ? 'selected' : ''}>10 問</option>
                    <option value="20" ${selectedCount == 20 ? 'selected' : ''}>20 問</option>
                    <option value="30" ${selectedCount == 30 ? 'selected' : ''}>30 問</option>
                    <option value="50" ${selectedCount == 50 ? 'selected' : ''}>50 問</option>
                    <option value="1000" ${selectedCount == 1000 ? 'selected' : ''}>全問出題（${allQuestions.length}問）</option>
                </select>
            </div>

            <div class="section-box">
                <div class="section-title">出題順序</div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                    <button class="order-btn ${isRandomOrder ? 'active' : ''}" onclick="setOrder(true)">ランダム</button>
                    <button class="order-btn ${!isRandomOrder ? 'active' : ''}" onclick="setOrder(false)">問題番号順</button>
                </div>
            </div>

            <button class="primary-btn" onclick="startQuiz()">演習を開始する</button>
        `;
    }

    // 出題順序の切り替え
    function setOrder(random) {
        isRandomOrder = random;
        renderMenu();
    }

    // クイズの構築と開始
    function startQuiz() {
        // 全問題をコピー
        selectedQuestions = [...allQuestions];

        if(selectedQuestions.length === 0) {
            alert('問題データがありません。');
            return;
        }

        // 順序の処理
        if (isRandomOrder) {
            for (let i = selectedQuestions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [selectedQuestions[i], selectedQuestions[j]] = [selectedQuestions[j], selectedQuestions[i]];
            }
        } else {
            selectedQuestions.sort((a, b) => parseInt(a.id) - parseInt(b.id));
        }

        // 問題数の切り出し
        const limit = parseInt(document.getElementById('count-select').value);
        if(selectedQuestions.length > limit) {
            selectedQuestions = selectedQuestions.slice(0, limit);
        }

        currentIdx = 0;
        showQuestion();
    }

    // 問題を表示する画面
    function showQuestion() {
        const container = document.getElementById('main-container');
        const q = selectedQuestions[currentIdx];

        container.innerHTML = `
            <button class="nav-btn" onclick="location.reload()">↩ 中断してメニューへ</button>
            <div class="quiz-progress">問題 ${currentIdx + 1} / ${selectedQuestions.length}</div>
            <div class="question-box">【問 ${q.id}】<br>${q.question}</div>
            
            <div class="options-list">
                ${q.options.map((opt, idx) => `
                    <button class="option-btn" onclick="checkAnswer(${idx + 1})">${idx + 1}. ${opt}</button>
                `).join('')}
            </div>

            <div id="result-box" class="result-area">
                <div id="result-title" class="result-title"></div>
                <div style="margin-top:5px; font-size:0.9rem;"><strong>解説:</strong> ${q.explanation}</div>
                <button class="primary-btn" style="margin-top:15px; padding:12px;" onclick="nextQuestion()">次へ進む</button>
            </div>
        `;
    }

    // 判定処理
    function checkAnswer(selected) {
        const q = selectedQuestions[currentIdx];
        const buttons = document.querySelectorAll('.option-btn');
        const resultBox = document.getElementById('result-box');
        const resultTitle = document.getElementById('result-title');

        buttons.forEach((btn, idx) => {
            btn.disabled = true;
            if(idx + 1 === q.correct) btn.classList.add('correct');
        });

        if(selected === q.correct) {
            resultBox.className = "result-area correct-box";
            resultTitle.innerText = "正解！";
        } else {
            resultBox.className = "result-area wrong-box";
            resultTitle.innerText = "不正解...";
            buttons[selected - 1].classList.add('wrong');
        }
        resultBox.style.display = 'block';
    }

    // 次へ
    function nextQuestion() {
        currentIdx++;
        if(currentIdx < selectedQuestions.length) {
            showQuestion();
        } else {
            document.getElementById('main-container').innerHTML = `
                <div style="text-align:center; padding:20px;">
                    <h2 style="color:var(--success-color); margin-top:0;">演習修了！</h2>
                    <p>設定されたすべての問題を解き終えました。</p>
                    <button class="primary-btn" onclick="location.reload()">メニューに戻る</button>
                </div>
            `;
        }
    }

    // アプリ起動
    window.onload = initApp;
</script>

</body>
</html>
