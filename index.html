<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnatoHack - 国試対策クイズ</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --success-color: #2ecc71;
            --error-color: #e74c3c;
            --light-color: #ecf0f1;
            --dark-color: #2c3e50;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: #f5f7fa;
            color: var(--dark-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 600px;
            padding: 30px;
            box-sizing: border-box;
            border-top: 6px solid var(--accent-color);
        }

        h1 {
            font-size: 1.6rem;
            text-align: center;
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-bottom: 25px;
        }

        /* セレクトボックスのスタイル */
        .select-zone {
            background-color: var(--light-color);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
        }

        .select-zone label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1rem;
        }

        .custom-select {
            width: 100%;
            max-width: 300px;
            padding: 10px 15px;
            font-size: 1rem;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            background-color: white;
            cursor: pointer;
            outline: none;
        }

        .custom-select:focus {
            border-color: var(--accent-color);
        }

        .start-btn {
            display: inline-block;
            margin-top: 15px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 30px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .start-btn:hover {
            background-color: #2980b9;
        }

        .quiz-progress {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-bottom: 10px;
            text-align: right;
            font-weight: bold;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: bold;
            line-height: 1.6;
            margin-bottom: 25px;
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--primary-color);
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .option-btn {
            background-color: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 14px 20px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            box-sizing: border-box;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #edf2f7;
            border-color: var(--accent-color);
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        /* 正解・不正解 */
        .option-btn.correct {
            background-color: #d4edda;
            border-color: var(--success-color);
            color: #155724;
            font-weight: bold;
        }

        .option-btn.wrong {
            background-color: #f8d7da;
            border-color: var(--error-color);
            color: #721c24;
        }

        /* 結果・解説 */
        .result-area {
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }

        .result-area.correct-box {
            background-color: #d4edda;
            border-left: 5px solid var(--success-color);
        }

        .result-area.wrong-box {
            background-color: #f8d7da;
            border-left: 5px solid var(--error-color);
        }

        .result-title {
            font-weight: bold;
            font-size: 1.3rem;
            margin-bottom: 8px;
        }

        .result-area.correct-box .result-title { color: var(--success-color); }
        .result-area.wrong-box .result-title { color: var(--error-color); }

        .explanation-text {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #2c3e50;
        }

        .next-btn {
            display: block;
            width: 100%;
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s;
        }

        .next-btn:hover {
            background-color: #1a252f;
        }

        .loading {
            text-align: center;
            font-size: 1.1rem;
            color: #666;
            padding: 40px 0;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>AnatoHack</h1>
    <div class="subtitle">国家試験対策 スマート学習アプリ</div>
    
    <div id="quiz-box">
        <div class="select-zone">
            <label for="quiz-select">📝 解く問題を選択してください</label>
            <select id="quiz-select" class="custom-select">
                <option value="data.csv">生理学・東洋医学（100問）</option>
                <option value="anato.csv">解剖学・その他</option>
            </select>
            <br>
            <button class="start-btn" onclick="loadSelectedCSV()">クイズをスタート</button>
        </div>
    </div>
</div>

<script>
    let quizData = [];
    let currentQuestionIndex = 0;

    // 選択されたCSVファイルを読み込む関数
    async function loadSelectedCSV() {
        const selectElement = document.getElementById('quiz-select');
        const selectedFile = selectElement.value;
        
        const quizBox = document.getElementById('quiz-box');
        quizBox.innerHTML = '<div class="loading">問題を読み込んでいます...</div>';

        try {
            const response = await fetch(selectedFile);
            if (!response.ok) throw new Error(`${selectedFile} が見つかりません。`);
            
            const text = await response.text();
            parseCSV(text);
        } catch (error) {
            quizBox.innerHTML = `
                <div style="color:red; text-align:center; font-weight:bold; padding: 20px;">
                    エラー: ${error.message}<br>
                    <span style="font-size:0.9rem; color:#666; font-weight:normal;">
                        リポジトリ内に該当のCSVファイル（${selectedFile}）が正しく配置されているか確認してください。
                    </span>
                    <br><br>
                    <button class="start-btn" onclick="location.reload()">戻る</button>
                </div>`;
        }
    }

    // CSVの文字列を解析する関数
    function parseCSV(text) {
        const lines = text.split(/\r?\n/);
        quizData = [];

        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;

            const parts = lines[i].split(',');
            if (parts.length < 7) continue;

            const explanation = parts.slice(7).join(',');

            quizData.push({
                id: parts[0],
                question: parts[1],
                options: [parts[2], parts[3], parts[4], parts[5]],
                correct: parseInt(parts[6].trim(), 10),
                explanation: explanation || '解説はありません。'
            });
        }

        // 問題をランダムにシャッフル
        shuffleArray(quizData);

        if (quizData.length > 0) {
            currentQuestionIndex = 0;
            showQuestion();
        } else {
            document.getElementById('quiz-box').innerHTML = `
                <div class="loading">有効な問題データがありません。</div>
                <button class="next-btn" onclick="location.reload()">選択画面に戻る</button>`;
        }
    }

    // 配列のシャッフル
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    // 問題を表示
    function showQuestion() {
        const quizBox = document.getElementById('quiz-box');
        const q = quizData[currentQuestionIndex];

        quizBox.innerHTML = `
            <div class="quiz-progress">問題 ${currentQuestionIndex + 1} / ${quizData.length}</div>
            <div class="question-text">【問 ${q.id}】<br>${q.question}</div>
            <div class="options-list">
                <button class="option-btn" onclick="checkAnswer(1)">1. ${q.options[0]}</button>
                <button class="option-btn" onclick="checkAnswer(2)">2. ${q.options[1]}</button>
                <button class="option-btn" onclick="checkAnswer(3)">3. ${q.options[2]}</button>
                <button class="option-btn" onclick="checkAnswer(4)">4. ${q.options[3]}</button>
            </div>
            <div id="result-box" class="result-area">
                <div id="result-title" class="result-title"></div>
                <div class="explanation-text"><strong>解説:</strong> <span id="explanation-content"></span></div>
                <button class="next-btn" onclick="nextQuestion()">次の問題へ</button>
            </div>
        `;
    }

    // 回答チェック
    function checkAnswer(selectedIdx) {
        const q = quizData[currentQuestionIndex];
        const buttons = document.querySelectorAll('.option-btn');
        const resultBox = document.getElementById('result-box');
        const resultTitle = document.getElementById('result-title');
        const explanationContent = document.getElementById('explanation-content');

        buttons.forEach((btn, idx) => {
            btn.disabled = true;
            if (idx + 1 === q.correct) {
                btn.classList.add('correct');
            }
        });

        if (selectedIdx === q.correct) {
            resultBox.className = "result-area correct-box";
            resultTitle.innerText = "正解！";
        } else {
            resultBox.className = "result-area wrong-box";
            resultTitle.innerText = "不正解...";
            buttons[selectedIdx - 1].classList.add('wrong');
        }

        explanationContent.innerText = q.explanation;
        resultBox.style.display = 'block';
    }

    // 次の問題へ
    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) {
            showQuestion();
        } else {
            document.getElementById('quiz-box').innerHTML = `
                <div style="text-align:center; padding:20px;">
                    <h2 style="color:var(--success-color);">全問終了です！</h2>
                    <p>素晴らしい！この調子で繰り返し復習しましょう！</p>
                    <button class="next-btn" onclick="location.reload()">問題選択に戻る</button>
                </div>
            `;
        }
    }
</script>

</body>
</html>
